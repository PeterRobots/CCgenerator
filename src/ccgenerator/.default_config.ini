[CCgenerator]
output-dir = .
highlight-words = false
max-line-width = 33
max-line-count = 3
; "nearest", "linear", "ignore"
interpolate-method = nearest
return-char-alignments = True
; all, srt, csv, txt
output-format = all
; all, speech, background, analyse (supply data file for audio)
mode = 'all'
; default, cpu, cuda ; default = if torch detected defaults to cuda otherwise cpu
device = default
device-index = 0
batch-size = 8
threads = 4
; "default", "float16", "float32", "int8"
compute-type = int8
low-resources = false
print-progress = false
verbose = false
log-level = info
secrets = .secrets

[ASR]
; Model list from faster-whisper.utils
;    "tiny.en": "Systran/faster-whisper-tiny.en"
;    "tiny": "Systran/faster-whisper-tiny"
;    "base.en": "Systran/faster-whisper-base.en"
;    "base": "Systran/faster-whisper-base"
;    "small.en": "Systran/faster-whisper-small.en"
;    "small": "Systran/faster-whisper-small"
;    "medium.en": "Systran/faster-whisper-medium.en"
;    "medium": "Systran/faster-whisper-medium"
;    "large-v1": "Systran/faster-whisper-large-v1"
;    "large-v2": "Systran/faster-whisper-large-v2"
;    "large-v3": "Systran/faster-whisper-large-v3"
;    "large": "Systran/faster-whisper-large-v3"
;    "distil-large-v2": "Systran/faster-distil-whisper-large-v2"
;    "distil-medium.en": "Systran/faster-distil-whisper-medium.en"
;    "distil-small.en": "Systran/faster-distil-whisper-small.en"
;    "distil-large-v3": "Systran/faster-distil-whisper-large-v3"
;    "distil-large-v3.5": "distil-whisper/distil-large-v3.5-ct2"
;    "large-v3-turbo": "mobiuslabsgmbh/faster-whisper-large-v3-turbo"
;    "turbo": "mobiuslabsgmbh/faster-whisper-large-v3-turbo"
asr-model = turbo
asr-model-cache-only = true
asr-model-dir = ~/.cache/asr
beam-size = 5
patience = 1.0
length-penalty = 1.0
; Tuple or list of temperatures
temperature = 0
temperature_increment_on_fallback = 0.2
best-of = 5
compression-ratio-threshold = 2.4
log-prob-threshold = 1.0
no-speech-threshold = 0.6
; Provide previous window result to next window to improve consistency, but enables failure loops
condition-on-previous-text = False
; Optional text prompt interpreter model
initial-prompt = None
; hints or phrases to provide to model to improve recognition, e.g. "WhisperX, PyAnnote, GPU"
hotwords = None
; csv list of token ids to suppress while sampling, '-1' suppresses most special characters.
suppress-tokens = '-1'
; wav2vec (alignment model) can't handle numerals or currency.
suppress-numerals = False

[ALIGN]
align-model-cache-only = true
align-model-dir = ~/.cache/alignment

[VAD]
; pyannote: community, precision
; Note precision is paid for and requires a pyannote key in .secrets
vad-model = community
vad-model-dir = ~/.cache/vad
; pyannote or silero
vad-method = pyannote
vad-onset = 0.500
vad-offset = 0.363
chunk-size = 30
; 2 or 3 letter language code: en, fr, de ...
language = "en"
; int
min-speakers = None
; int
max-speakers = None
return-speaker-embeddings = True

[AST]
; default is mit =  ast-finetuned-audioset-10-10-04593
ast-model = mit
ast-model-cache-only = true
ast-model-dir = ~/.cache/ast
score-threshold = 0.1
